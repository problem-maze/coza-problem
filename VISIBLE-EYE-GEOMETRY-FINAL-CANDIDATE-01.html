<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED GEOMETRY STUDY — FINAL CANDIDATE 01.
     Not connected to production: no heroEyeSvg / HeroV1Life /
     AtmosphereGL / Journey / Q-A reference anywhere in this file.
     Geometry only — no color, no glow, no motion, no UI, no badge.

     Consolidates the Lab 02 decision:
       · C3 supplies the convergence architecture (the base direction)
       · C1 supplies only the calm outer containment
       · C2 supplies only a small amount of route logic — two paths

     LOCKED, carried unchanged from every prior lab: outer lid
     silhouette, pupil anchor and size, overall proportions, calm
     negative space, monochrome graphite. The internal field is
     clipped to the eye's actual opening (the lens between the two
     lid curves) so nothing crosses the lid line — with no glow to
     soften that edge, an overrun reads as an error, not as depth.

     Ink weight rises monotonically inward — lightest at the outer
     boundary, densest at the convergence — so the eye is led from
     the open field to the resolved center. That gradient is what
     carries "organized complexity resolving into understanding";
     no ring is ever closed, and gaps are golden-angle offset
     between layers, so it cannot settle into a radar/target read.
     ══════════════════════════════════════════════════════════════ */
