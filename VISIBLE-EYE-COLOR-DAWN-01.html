  /* ══════════════════════════════════════════════════════════════
     ISOLATED SINGLE-PALETTE COLOR TEST — COLOR DAWN 01.
     Geometry is FROZEN, copied verbatim from
     VISIBLE-EYE-ARCHITECTURE-REFINE-01.html. No path, order, scale,
     pupil, or composition change — color only.

     ROLE MAPPING (dawn palette):
     · Structural ink #332A2A — lid + pupil. Solid, darkest value,
       unchanged in role from prior labs.
     · Primary #D88472 — the two innermost nested rings + the two
       emphasized edges only. Narrower than Color Lab 01's primary
       tier (which also included the third ring in) — this brief
       defines primary as strictly the two innermost rings, so the
       third ring (previously primary) moves down into secondary
       below as an "outer-mid" layer.
     · Secondary #E8A06A — the three outer-mid rings + the macro
       bracket.
     · Quiet #E8CFC4 — the outermost ring + the five cross-ties.
     · Cool Shadow #C79BA1 — used nowhere except the three witness
       lines. This is the one placement decision not spelled out
       verbatim in the brief (witness lines were grouped under
       "quiet" by name, but a sixth color needs its own restrained,
       earned placement rather than folding invisibly into an
       existing tier). Witness lines already have a distinct job —
       they are the only marks that cut through every nested layer —
       so giving that one function a single cool note reads as a
       quiet structural balance against the warm field, not as a
       second identity color: 3 short lines out of 23 internal marks.
     · Rare accent #F0B36C — only the six ticks at the two true
       intersection points. Nowhere else.

     No glow, gradient, shadow, blur, glass, material, animation, or
     new geometry. Flat color and restrained alpha only.
     ══════════════════════════════════════════════════════════════ */

</style>
