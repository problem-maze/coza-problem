<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PME — logo v1 (mastered)</title>
<style>
  :root{--void:#050810;--ice:#e8eff9;--cyan:#cfe3ff;--slate:#8693ae}
  html,body{margin:0;background:var(--void);height:100%}
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px}
  .mark{width:min(78vw,620px)}
  .mark path,.mark circle{vector-effect:non-scaling-stroke}
  .cap{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:var(--slate)}
  .cap b{color:var(--cyan);font-weight:500}
</style>
</head>
<body>
  <div class="stage">
    <img class="mark" src="pme-logo.svg" alt="PME logo">
    <div class="cap">Problem <b>·</b> Maze <b>·</b> Eye — mark v1</div>
  </div>
</body>
</html>
