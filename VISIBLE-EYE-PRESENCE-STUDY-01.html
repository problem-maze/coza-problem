<title>Visible Eye — Presence Study 01</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED PRESENCE STUDY — geometry only, monochrome, static.
     Same lid silhouette and same pupil anchor/size as the working
     specimen. Everything inside is rebuilt around a different
     working logic than the earlier geometry labs: presence first,
     formal system second.

     Four reading levels:
     · Silhouette — unchanged lid, calm and authoritative.
     · Gaze core — two tight faceted open rings hugging the pupil,
       each with one of its own edges redrawn bold on the dominant
       side. The bold edges (not a radiating fan, not just darker
       ink) are what make the core read as deliberate. A small
       off-axis facet cluster sits nearby, tied back to the core by
       one bridge line — a localized concentration rather than a
       ring, and never centered on the eye's own axis.
     · Inner field — five open faceted rings at uneven radii,
       rotations, and edge counts. None are full closed circles.
       Their weight is driven by one continuous cosine field
       centered on the same dominant direction as the core's bold
       edges, so they thicken on that side and thin — but never
       vanish — on the other. Ten short bridge strokes pull the
       innermost ring toward the core, concentrated on the dominant
       side, so the field visibly organizes around the core instead
       of sitting as independent parallel rings.
     · Peripheral support — two faint long arcs and two witness
       chords, kept quiet and mostly off the dominant side, present
       only to unify the composition without competing with it.

     The same cosine field (floor ~0.30, so the quiet side is never
     fully absent) drives every weight decision in the piece — one
     coherent lean, which is the controlled asymmetry, rather than
     scattered or mirrored placement.
     ══════════════════════════════════════════════════════════════ */

</style>
