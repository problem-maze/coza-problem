<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible Eye — Geometry Lab 02</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED VISUAL LABORATORY — EXPERIMENT 02, GEOMETRY ONLY.
     Second generation, derived from Lab 01's Hybrid (C) direction
     only — Segmented (A) and Corridor (B) as standalone directions
     are retired per the visual conclusion from experiment 01.
     Not connected to production in any way (no heroEyeSvg /
     HeroV1Life / AtmosphereGL / Journey / Q-A reference).

     All three share: outer lid silhouette, pupil position + size,
     overall dimensions, viewBox, background, and the same lens
     clipPath approach as Lab 01 (the internal field is clipped to
     the eye's actual opening, not a raw circle radius, so nothing
     crosses the lid line without glow to hide it).

     C1 — Controlled Arc Emphasis: three layered containment rings
          carry the piece; corridors are short and subordinate,
          handing off into the center rather than competing with it.
     C2 — Corridor Logic Emphasis: one quiet field-boundary ring;
          routes carry the piece. Real two-wall passages (paired
          offset lines) for half the routes, one explicit fork, to
          read as path logic rather than crack/fragment.
     C3 — Center Convergence Emphasis: balanced outer field, but
          routes are aimed to terminate flush against a three-ring,
          dense-fibril convergence zone — the center visibly gathers
          what the outer field sends it.

     All three also carry a strengthened shared center/convergence
     motif (tight broken rings + curved fibrils immediately around
     the pupil) — Lab 01's center read as weak across all variants;
     this is addressed here at a baseline level in every version,
     pushed hardest in C3.
     ══════════════════════════════════════════════════════════════ */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    background:#f4f5f7;
    color:#1e2430;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .lab-head{
    padding:40px 24px 8px;
    text-align:center;
  }
  .lab-title{
    font-size:13px;
    font-weight:600;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:#6b7280;
  }
  .lab-sub{
    margin-top:6px;
    font-size:12px;
    color:#9aa1ac;
    letter-spacing:0.3px;
  }
  .lab-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap:28px;
    padding:32px 24px 60px;
  }
  .lab-card{
    width:400px;
    max-width:90vw;
    background:#ffffff;
    border:1px solid #e4e6ea;
    border-radius:18px;
    padding:18px 14px 22px;
  }
  .lab-card svg{
    display:block;
    width:100%;
    height:auto;
  }
  .lab-card-label{
    margin-top:14px;
    text-align:center;
  }
  .lab-card-id{
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    color:#2a303c;
  }
  .lab-card-name{
    margin-top:3px;
    font-size:11px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:#9aa1ac;
  }

  /* ── shared eye geometry — identical across all three variants ── */
  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }
  .eye-pupil{ fill:#232936; }
</style>
