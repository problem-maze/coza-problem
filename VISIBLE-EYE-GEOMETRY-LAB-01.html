<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible Eye — Geometry Lab 01</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED VISUAL LABORATORY — EXPERIMENT 01, GEOMETRY ONLY.
     This file is not connected to production. It does not import,
     reference, or modify heroEyeSvg / HeroV1Life / AtmosphereGL /
     Journey / Q-A states in any way. Three static, non-animated,
     monochrome variants of ONE internal-geometry question:
     what does a Visible/Light eye look like when its reasoning
     structure is designed natively for a bright field, instead of
     recolored from the dark maze?

     All three share: outer lid silhouette, pupil position + size,
     overall dimensions, viewBox, background. Only the internal
     architecture between the lid boundary and the pupil differs.
     Each is clipped to the eye's actual opening (the lens between
     the two lid curves) so the structure recedes at the same edge
     the lid itself draws — no piece of it is allowed to cross the
     lid line, which is what "reads as a maze" instead of "reads as
     a mistake" without any glow to blur that edge.
     ══════════════════════════════════════════════════════════════ */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    background:#f4f5f7;
    color:#1e2430;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh;
  }
  .lab-head{
    padding:40px 24px 8px;
    text-align:center;
  }
  .lab-title{
    font-size:13px;
    font-weight:600;
    letter-spacing:2.5px;
    text-transform:uppercase;
    color:#6b7280;
  }
  .lab-sub{
    margin-top:6px;
    font-size:12px;
    color:#9aa1ac;
    letter-spacing:0.3px;
  }
  .lab-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:flex-start;
    gap:28px;
    padding:32px 24px 60px;
  }
  .lab-card{
    width:400px;
    max-width:90vw;
    background:#ffffff;
    border:1px solid #e4e6ea;
    border-radius:18px;
    padding:18px 14px 22px;
  }
  .lab-card svg{
    display:block;
    width:100%;
    height:auto;
  }
  .lab-card-label{
    margin-top:14px;
    text-align:center;
  }
  .lab-card-id{
    font-size:12px;
    font-weight:700;
    letter-spacing:2px;
    color:#2a303c;
  }
  .lab-card-name{
    margin-top:3px;
    font-size:11px;
    letter-spacing:1.2px;
    text-transform:uppercase;
    color:#9aa1ac;
  }

  /* ── shared eye geometry — identical across all three variants ── */
  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }
  .eye-pupil{ fill:#232936; }
</style>
</head>
