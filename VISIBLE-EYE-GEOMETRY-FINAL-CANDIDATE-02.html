<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED GEOMETRY STUDY — FINAL CANDIDATE 02.
     Not connected to production: no heroEyeSvg / HeroV1Life /
     AtmosphereGL / Journey / Q-A reference anywhere in this file.
     Geometry only — no color, no glow, no motion, no UI, no badge.

     Refinement pass on Candidate 01, same containment -> field ->
     convergence logic, four corrections from review:

     · Convergence rebuilt as a BASIN, not a denser tangle: three
       broken rings (down from four) with few, evenly-spaced
       segments, and every fibril sweeping the same rotational
       sense at the same curvature — a coherent draw toward the
       pupil, not independent scratches at random angles.
     · One primary route only: single bend, boldest and widest line
       in the piece, unmistakable start-to-center.
     · One secondary route that CANNOT be mistaken for a second main
       path: it forks off the primary, bends away from it, and fades
       over three shortening, lightening segments to nothing — a
       route considered, not taken.
     · Mid-field corridors placed at four explicit, evenly-spread
       angles (two upper, two lower) instead of wherever the
       containment layer's gaps happened to fall, and the primary
       route itself was moved into the lower field — that combination
       is what was reading as top/upper-left-loaded.
     · Outer containment ink raised a step (0.22-0.32 -> 0.30-0.42)
       while spans stay short, so it reads as a stronger structural
       field without becoming a closed ring.

     LOCKED, unchanged: outer lid silhouette, pupil anchor and size,
     overall proportions, calm negative space, monochrome graphite.
     The internal field is still clipped to the eye's actual opening
     (the lens between the two lid curves) so nothing crosses the lid
     line — with no glow to soften that edge, an overrun reads as an
     error, not as depth.

     Ink weight still rises monotonically inward — lightest at the
     outer boundary, densest at the convergence — and every layer's
     gaps stay golden-angle offset from the layer inside it, so nothing
     can settle into a radar/target read.
     ══════════════════════════════════════════════════════════════ */
