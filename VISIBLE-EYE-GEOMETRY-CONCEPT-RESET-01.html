<title>Visible Eye — Concept Reset 01</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED GEOMETRY STUDY — CONCEPT RESET 01.
     Not connected to production: no heroEyeSvg / HeroV1Life /
     AtmosphereGL / Journey / Q-A reference anywhere in this file.
     Geometry only — no color, no glow, no motion, no UI, no badge.

     This is a conceptual rebuild, not a refinement of the FINAL
     CANDIDATE files. Those built a route diagram: a distinct outer
     containment layer, a distinct corridor layer, one bold "answer"
     line and one visibly fading "abandoned" line — several different
     stroke grammars stacked together. Stacking components is exactly
     what reads as an assembled diagram rather than a field.

     Here there is ONE grammar for the entire eye: short fragments of
     a logarithmic spiral wound around the pupil (r = r0 * e^(-b*θ),
     b = ln(φ)/(π/2) — the same pitch constant this codebase already
     uses for its golden-spiral motif elsewhere, reused here only as
     a shared constant, not shared code). Every mark in the field —
     from the quiet outer edge to the dense center — is a sample of
     that one curve family at a different radius, span, and weight.
     There is no separate ring layer, corridor layer, or route layer.

     Structural logic:
     · Radius decreases -> span, weight, and ink all increase. The
       basin is not a denser cluster of a different element type; it
       is the same field, read at the radius where it has gathered.
     · Every fragment turns the same rotational direction. That
       shared bias is what makes the field feel organized rather than
       scattered, without drawing a literal path.
     · A small number of fragments (3 of 30) are given roughly double
       the angular span of their neighbours — nothing else about
       them differs: same weight family, same alpha curve, same
       color. This is the entire treatment of "route logic": a few
       threads are more continuous than the rest. Nothing is
       highlighted, nothing has a start marker or an end marker,
       nothing is styled as an answer.
     · Placement uses golden-angle stepping (no two fragments share a
       start angle), which is also what keeps the piece from reading
       as concentric rings or radial spokes despite being built from
       one repeated formula.

     LOCKED, unchanged: outer lid silhouette, pupil anchor and size,
     overall proportions, calm negative space, monochrome graphite,
     the lens clipPath that keeps the field inside the eye's actual
     opening.
     ══════════════════════════════════════════════════════════════ */

    padding:48px 24px;
  }
  .stage{ width:840px; max-width:100%; background:#ffffff; border:1px solid #e4e6ea; border-radius:20px; padding:28px 22px; }
  .stage svg{ display:block; width:100%; height:auto; }
  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }
  .eye-pupil{ fill:#232936; }
</style>
