<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible Eye — Ring System Prototype 01</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     RING SYSTEM PROTOTYPE 01 — visual-engineering reconstruction of
     the selected Tier-1 reference. Not a new geometry concept and not
     a continuation of the Presence Prototype line: this replaces that
     interior entirely with a coordinated system of 8 segmented,
     elliptical, open-gap rings around the pupil, in three structural
     depths (inner red identity / mid graphite / outer quiet graphite).

     Static reconstruction only — no animation, glow, bloom, blur, drop
     shadow, or glass effect. Outer almond lid, pupil anchor, and lens
     clipPath reuse the exact geometry already established across every
     prior Visible Eye artifact (same viewBox, same two lid curves).
     ══════════════════════════════════════════════════════════════ */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    background:#FAFBFD; color:#24272E;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 24px;
  }
  .stage{
    width:640px; max-width:100%; background:#FFFFFF;
    border:1px solid #E4E7EC; border-radius:20px; padding:28px 22px;
  }
  .stage svg{ display:block; width:100%; height:auto; }
  svg{
    --bg:#FAFBFD;
    --ink:#24272E;
    --support:#7C8088;
    --quiet:#C9CDD3;
    --red:#D17B73;
    --red-72: color-mix(in srgb, var(--red) 72%, var(--bg) 28%);
    --red-40: color-mix(in srgb, var(--red) 40%, var(--bg) 60%);
  }
  .eye-lid{ fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; }
</style>
</head>
<body>
  <div class="stage">
    <svg viewBox="-320 -140 640 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="lensRing1" clipPathUnits="userSpaceOnUse">
          <path d="M -290 0 Q 0 -70 290 0 Q 0 240 -290 0 Z"/>
        </clipPath>
      </defs>

      <!-- outer almond — locked Problem eye silhouette, unchanged geometry -->
      <path class="eye-lid" d="M -290 0 Q 0 -70, 290 0"/>
      <path class="eye-lid" d="M -290 0 Q 0 240, 290 0"/>

      <g clip-path="url(#lensRing1)">

        <!-- ═══ OUTER QUIET SYSTEM — widest, lightest, recedes into the field ═══ -->
        <g id="outerQuietSystem">
          <path id="ringO1" d="M -143.35,45.0 A 184,106 0 1 1 188.9,28.25" fill="none" stroke="var(--quiet)" stroke-width="0.85" stroke-opacity="0.45" stroke-linecap="round"/>
          <path id="ringO2" d="M 218.97,32.36 A 216,118 0 1 1 -21.51,-124.21" fill="none" stroke="var(--quiet)" stroke-width="0.7" stroke-opacity="0.32" stroke-linecap="round"/>
        </g>

        <!-- ═══ MID GRAPHITE SYSTEM — supports and expands the core, rhythm + depth ═══ -->
        <g id="midGraphiteSystem">
          <path id="ringM3" d="M -124.95,-39.12 A 150,91 0 1 1 67.3,77.51" fill="none" stroke="var(--support)" stroke-width="1.0" stroke-opacity="0.35" stroke-linecap="round"/>
          <path id="ringM2" d="M 77.0,58.68 A 122,77 0 1 1 109.46,-57.49" fill="none" stroke="var(--support)" stroke-width="1.15" stroke-opacity="0.48" stroke-linecap="round"/>
          <path id="ringM1" d="M 99.14,-39.0 A 96,62 0 1 1 -67.14,-39.0" fill="none" stroke="var(--support)" stroke-width="1.35" stroke-opacity="0.60" stroke-linecap="round"/>
        </g>

        <!-- ═══ INNER IDENTITY SYSTEM — closest to the pupil, strongest, muted red ═══ -->
        <g id="innerIdentitySystem">
          <path id="ringR3" d="M 29.89,-62.16 A 80,55 0 0 1 32.63,45.8" fill="none" stroke="var(--red-40)" stroke-width="1.3" stroke-opacity="0.48" stroke-linecap="round"/>
          <path id="ringR2" d="M 35.78,-50.8 A 64,45 0 0 1 49.91,30.16" fill="none" stroke="var(--red-72)" stroke-width="1.9" stroke-opacity="0.75" stroke-linecap="round"/>
          <path id="ringR1" d="M 40.0,-37.44 A 48,34 0 0 1 52.77,13.85" fill="none" stroke="var(--red)" stroke-width="2.5" stroke-opacity="0.95" stroke-linecap="round"/>
        </g>

        <!-- ═══ quiet anchor nodes — very small number, no radial/spoke reading ═══ -->
        <g id="anchorNodes">
          <circle cx="-76" cy="-22" r="3.0" fill="var(--support)" fill-opacity="0.55"/>
          <circle cx="108" cy="-16" r="2.4" fill="var(--red)" fill-opacity="0.75"/>
          <circle cx="166" cy="42" r="2.8" fill="var(--quiet)" fill-opacity="0.50"/>
        </g>

      </g>

      <!-- pupil — centered dark anchor, outside the clip so it is never cropped -->
      <circle cx="16" cy="-8" r="34" fill="var(--ink)"/>
    </svg>
  </div>
</body>
</html>
