<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible Eye — Cognitive Topology 01</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED GEOMETRY STUDY — COGNITIVE TOPOLOGY 01.
     Not connected to production: no heroEyeSvg / HeroV1Life /
     AtmosphereGL / Journey / Q-A reference anywhere in this file.
     Geometry only — no color, no glow, no motion, no UI, no badge.

     Fresh build, not a patch on either Concept Reset file. Both of
     those forced the entire field through one repeated shape (a
     fragment of a single governing curve) — Reset 01 as a uniform
     spiral, Reset 02 as the same spiral with its parameters varied
     by zone. Even zoned, one repeated primitive reads as an orbital
     motif, not a field of relationships.

     Here the grammar is a set of RULES, not a shape: every mark is
     built from one operation — "a stroke from a point, in a
     direction, for a length, with a bow" — but that operation is
     used to express three different kinds of RELATIONSHIP between
     nearby marks:
       · isolated  — a mark with no relationship to its neighbours
       · near       — two marks whose facing ends approach but do
                      not touch (a small, deliberate gap)
       · resolved   — 2-3 marks joined end to end into one bending
                      line (an actual connection)
     Local pockets of marks (never a global ring, spiral, or grid)
     are placed with minimum-separation rejection sampling, so the
     gaps between pockets are as designed as the pockets themselves.
     Near the pupil, "resolved" becomes the dominant relationship and
     local orientation tightens; further out, "isolated" and "near"
     dominate and orientation loosens. A wedge directly beside the
     pupil is deliberately left empty — an opening in the near-pupil
     field, not a ring closing around it.

     LOCKED, unchanged: outer lid silhouette, pupil anchor and size,
     calm negative space, monochrome graphite, the lens clipPath that
     keeps every mark inside the eye's actual opening.
     ══════════════════════════════════════════════════════════════ */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    background:#f4f5f7; color:#1e2430;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 24px;
  }
  .stage{ width:840px; max-width:100%; background:#ffffff; border:1px solid #e4e6ea; border-radius:20px; padding:28px 22px; }
  .stage svg{ display:block; width:100%; height:auto; }
  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }
  .eye-pupil{ fill:#232936; }
</style>
</head>
