  /* ══════════════════════════════════════════════════════════════
     ISOLATED GEOMETRY STUDY — COGNITIVE TOPOLOGY 02.
     Not connected to production: no heroEyeSvg / HeroV1Life /
     AtmosphereGL / Journey / Q-A reference anywhere in this file.
     Geometry only — no color, no glow, no motion, no UI, no badge.

     Topology 01 read as organic branching / capillary structure.
     The cause was curvature: every mark was a quadratic-bezier
     "bow", and continuous variable curvature is the visual signature
     of vascular/root growth regardless of how the marks relate to
     each other. This build removes curvature entirely — every mark
     is one or two STRAIGHT segments — and replaces "growth" with
     "alignment" as the hierarchy signal: parallel strokes read as
     agreement/order, scattered independent angles read as
     unresolved. That distinction, not curvature, is what a designer
     actually uses to show resolved vs. unresolved structure.

     Same three relationships as Topology 01, redrawn without any
     curve or shared-origin branching (never more than two straight
     segments touch at one point, and that only inside a "resolved"
     connector — nothing ever forks three ways, which is the other
     half of what reads as vascular/crack):
       · isolated — a lone straight stroke, wide independent angle
       · near      — two strokes at nearly the same angle, placed
                     tip-to-tip with a small deliberate gap
       · resolved  — a tight bundle of near-parallel strokes (order,
                     by alignment, not by drawing a path), sometimes
                     paired with one two-segment connector that turns
                     at a single fixed angle (a drafted joint, not an
                     organic bend)
     Pockets are placed one per angular sector instead of by pure
     chance, so coverage is even in every direction rather than
     concentrating wherever randomness happened to favor.

     LOCKED, unchanged: outer lid silhouette, pupil anchor and size,
     calm negative space, monochrome graphite, the lens clipPath that
     keeps every mark inside the eye's actual opening.
     ══════════════════════════════════════════════════════════════ */

  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }
  .eye-pupil{ fill:#232936; }
</style>
