<title>Visible Eye — Color Lab 01</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED COLOR-ARCHITECTURE STUDY — COLOR LAB 01.
     Geometry is FROZEN, copied verbatim from
     VISIBLE-EYE-ARCHITECTURE-REFINE-01.html. Nothing about the
     paths, order, scale, pupil, or composition changed in this
     file — only stroke/fill color per role.

     COLOR ROLES (identical mapping across all four variants):
     · Structural ink   — outer lid silhouette + pupil. Always solid,
       always the darkest value in the system. Authoritative anchor.
     · Primary identity — the two innermost nested rings plus the two
       bold emphasis edges. Highest saturation, highest alpha,
       concentrated closest to the pupil — this is what makes the
       primary color read as the dominant identity color without
       needing to touch most of the piece.
     · Secondary depth  — two outer-mid rings plus the one macro
       bracket that crosses the nesting. Present, but always a step
       back from primary in both saturation and alpha.
     · Quiet geometry    — the outermost ring, the three witness
       lines, and the five cross-ties. Palest tone, lowest alpha of
       the four tiers. Numerous but visually recessive.
     · Restrained accent — ONLY the six short ticks that make up the
       two micro-detail clusters, i.e. only where the macro bracket
       actually crosses the nested rings. Every other role appears
       many times across the eye; accent appears at exactly two
       earned locations and nowhere else.

     No gradients, glow, shadow, animation, or new geometry. Flat
     color + restrained alpha only.
     ══════════════════════════════════════════════════════════════ */

  .panel svg{ display:block; width:100%; height:auto; }
  .cap{ padding:14px 4px 2px; }

  .cap-target{ font-size:12px; opacity:0.6; margin-top:2px; font-style:italic; }
</style>
