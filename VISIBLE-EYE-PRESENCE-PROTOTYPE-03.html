<title>Visible Eye — Presence Prototype 03</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED INTEGRATED PROTOTYPE 03 — third pass, same locked lid/
     pupil/lunar-white shell, interior deepened again from Prototype
     02 per explicit feedback: core still too weak, mid-field still
     not rich enough, red still read as an accent rather than a
     signal, motion still too subtle.

     Upgrades from 02:
     · Gaze core — four boundaries (was three) + four hinge bridges
       + one long internal tension strut cutting across the chamber
       + three ticks (one now reaching into the lower/quiet side).
       Red is now a full-scale structural boundary (coreB2) with a
       nested full-saturation focus arc and hinge — a lit wall of
       the chamber, not a small accent poking out of it.
     · Mid-field — five boundaries (was four), both trace clusters
       enlarged (12 + 10, was 9 + 7), six connective/nested bridges
       (was four), four opening-gate marks (was two).
     · Peripheral — spread trace count raised to keep the inner
       field feeling embedded, not floating.
     · Motion — shorter, larger-amplitude cycles; the core's red
       wall and its nested focus arc are put in deliberate opposite
       phase on the same period so attention visibly transfers
       between them, plus a small rotation on the tension strut for
       a "relational shift" cue.

     Total structural elements: ~63 (was 51 in Prototype 02).
     Still: no glow, no heavy blur, no glass, no 3D — soft opacity
     layering and light blur only. Still isolated from production.
     ══════════════════════════════════════════════════════════════ */

  html,body{
    background:#FAFBFD; color:#24272E;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 24px;
  }
  .stage{
    width:840px; max-width:100%; background:#FFFFFF;
    border:1px solid #E4E7EC; border-radius:20px; padding:28px 22px;
  }
  .stage svg{ display:block; width:100%; height:auto; }
  svg{
    --lunar:#FAFBFD; --ink:#24272E; --red-base:#B75C58;

    --red-45: color-mix(in srgb, var(--red-base) 45%, var(--lunar) 55%);
  }
  .eye-lid{ fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; }
</style>

    // "relational shift" motion instead of the whole core

    const tGroup = document.getElementById('tensionGroup');
    if (strut && tGroup) tGroup.appendChild(strut);

    const cycles = [
      ["midEmphA", 3.5, -0.4], ["midEmphB", 5, -1.2], ["midEmphC", 6.5, -2.5],
      ["midEmphD", 8, -3.5], ["midEmphE", 9.5, -1], ["midEmphF", 7, -4],
      ["coreB2", 8, 0], ["redFocus", 8, -4], ["redHinge", 6, -1.5],
      ["redMidA", 10, -3], ["redMidB", 13, -6],
    ];
    cycles.forEach(([id, dur, beginOff]) => {
      const el = document.getElementById(id);
      if (!el) return;
      const base = parseFloat(el.getAttribute('stroke-opacity'));
      const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      anim.setAttribute('attributeName', 'stroke-opacity');
      const lo = Math.max(0.07, base*0.48).toFixed(3);
      const hi = Math.min(0.96, base*1.5).toFixed(3);
      anim.setAttribute('values', `${base};${hi};${lo};${base}`);
      anim.setAttribute('keyTimes', '0;0.35;0.7;1');
      anim.setAttribute('dur', dur + 's');
      anim.setAttribute('begin', beginOff + 's');
      anim.setAttribute('calcMode', 'spline');
      anim.setAttribute('keySplines', '0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1');
      anim.setAttribute('repeatCount', 'indefinite');
      el.appendChild(anim);
    });
  </script>
</body>
</html>
