<title>Visible Eye — Presence Study 02</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED PRESENCE STUDY 02 — geometry only, monochrome, static.
     Same lid silhouette and same pupil anchor/size. The internal
     field is rebuilt again, away from any ring/polygon system as
     the main idea — this version is built from four zones instead.

     · Awareness chamber — three smooth partial arcs at close,
       uneven radii, none closing into a full ring, none straight-
       edged. Present mostly on the upper side, genuinely open
       toward the lower-left: the pupil is held, not caged.
     · Upper concentration field — a small, deliberate cluster of
       short marks placed by a deterministic low-discrepancy
       sequence, kept only where a gaussian weight around one
       off-center point is strong enough, with a minimum spacing
       enforced between marks so each one stays individually
       legible instead of fusing into a hatched patch. All marks
       share one loose grain direction (small jitter only) rather
       than pointing at the pupil, so the cluster reads as gathered
       attention, not a spoke pattern. Three marks near the center
       of the cluster are drawn bolder — the field's own point of
       greatest intent.
     · Lower quiet basin — two long, faint, unhurried arcs. Not a
       mirrored copy of the upper field: fewer, longer, calmer,
       more spaced.
     · Quiet outer eye — left empty. Silence, not a faint line
       standing in for it.

     Two earlier internal drafts were rejected before this one: a
     radial version read as literal eyelashes, and a denser packed
     version of this same cluster idea read as combed hatching /
     an eyebrow. Spacing the marks apart and giving them one shared
     grain (instead of a fan of directions) is what kept the field
     legible as attention rather than texture.
     ══════════════════════════════════════════════════════════════ */

  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }
  .eye-pupil{ fill:#232936; }
</style>
