<title>Visible Eye — Presence Prototype 02</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED INTEGRATED PROTOTYPE 02 — interior rebuilt from zero.
     Locked from Prototype 01: lid silhouette, pupil anchor/size,
     lunar-white environment. Everything inside is new.

     Three zones, deliberately different in density/character but
     tied into one system by shared bridges and a shared dominant
     direction (~20-25°, carried through core, mid-field, and red):
     · Gaze core — three offset partial boundaries joined end-to-end
       by three bridges into one asymmetric mechanism that dips into
       the lower field (not a ring/cage/spokes), plus two ticks and
       an integrated red sub-system (focus arc + hinge + echo).
     · Cognitive mid-field — four broken boundaries spanning from
       the dominant side down into the lower field, two spaced trace
       clusters (dominant + lower, both real, both spaced so they
       stay legible marks), connective bridges, two gate marks at
       one boundary's opening, two small red echoes continuing the
       core's red directly outward.
     · Peripheral field — quiet arcs plus a spread, spaced trace set
       covering the full outer ring including the lower half, so the
       inner field feels embedded rather than floating in empty
       space.

     Red (#B75C58) is confined to the core and its immediate mid-
     field extension — five marks total, all structurally connected
     to each other, nowhere else in the piece.

     Motion (SMIL, short desynced cycles so change is visible across
     a few seconds rather than imperceptible over a minute):
     pupil drift 7s, core scale 5s, four mid-field emphasis shifts on
     4/6/8/9s, three red marks cross-fading attention on 5/7/11s.
     ══════════════════════════════════════════════════════════════ */

    padding:48px 24px;
  }
  .stage{
    width:840px; max-width:100%; background:#FFFFFF;

  }
  .stage svg{ display:block; width:100%; height:auto; }

    --red-45: color-mix(in srgb, var(--red-base) 45%, var(--lunar) 55%);
  }
  .eye-lid{ fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; }
</style>
</head>

  <script>
    const cycles = [
      ["midEmphA", 4, -0.5], ["midEmphB", 6, -1.5], ["midEmphC", 8, -3], ["midEmphD", 9, -4],
      ["redFocus", 5, 0], ["redMidA", 7, -2.2], ["redMidB", 11, -5],
    ];
    cycles.forEach(([id, dur, beginOff]) => {
      const el = document.getElementById(id);
      if (!el) return;
      const base = parseFloat(el.getAttribute('stroke-opacity'));
      const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      anim.setAttribute('attributeName', 'stroke-opacity');
      const lo = Math.max(0.08, base*0.55).toFixed(3);
      const hi = Math.min(0.95, base*1.42).toFixed(3);
      anim.setAttribute('values', `${base};${hi};${lo};${base}`);
      anim.setAttribute('keyTimes', '0;0.35;0.7;1');
      anim.setAttribute('dur', dur + 's');
      anim.setAttribute('begin', beginOff + 's');
      anim.setAttribute('calcMode', 'spline');
      anim.setAttribute('keySplines', '0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1');
      anim.setAttribute('repeatCount', 'indefinite');
      el.appendChild(anim);
    });
