<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Natural Eye — R4 Real Image Water Motion</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;--ink:#f3f7f1;--muted:#aebdb1;--panel:rgba(11,22,16,.94);--line:rgba(237,246,237,.2);--accent:#e7f0c9;--accent-ink:#18251b;--warning:#ffd58b}
html,body{margin:0;min-width:100%;min-height:100%;background:#09110d;color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{min-height:100dvh;overflow:hidden}
button,summary{font:inherit}
button{appearance:none;border:1px solid var(--line);border-radius:999px;background:rgba(245,250,243,.08);color:var(--ink);padding:9px 11px;font-size:10px;font-weight:850;letter-spacing:.035em;line-height:1;cursor:pointer;white-space:nowrap}
button:hover{background:rgba(245,250,243,.16)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
button:disabled{cursor:not-allowed;opacity:.45}
.app{position:relative;display:flex;flex-direction:column;min-height:100dvh;background:radial-gradient(circle at 50% 0%,#1a3025 0%,#09110d 56%)}
.scene-stage{position:relative;display:grid;place-items:start center;min-height:0;flex:1;padding:clamp(8px,2vw,18px);overflow:auto}
.scene-frame{position:relative;width:min(100%,calc((100dvh - 128px) * 1.5));aspect-ratio:3 / 2;flex:0 0 auto;overflow:hidden;background:#24372b;border:1px solid rgba(255,255,255,.17);box-shadow:0 18px 46px rgba(0,0,0,.38)}
.scene-frame img,.scene-frame canvas,.debug-overlay{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;display:block}
.scene-reference{z-index:1;object-fit:fill}
.scene-renderer{z-index:2;image-rendering:auto}
.debug-overlay{z-index:4;pointer-events:none;display:none;overflow:visible}
.debug-overlay.is-visible{display:block}
.debug-path{fill:none;stroke-width:3;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-dasharray:8 5}
.debug-path.is-water{stroke:#79d9e5;stroke-width:4;stroke-dasharray:none}
.debug-path.is-static{stroke:#f0c66b}
.debug-label rect{fill:rgba(5,14,9,.86);stroke:rgba(255,255,255,.72);stroke-width:1;vector-effect:non-scaling-stroke}

.scene-status{position:absolute;z-index:6;top:9px;left:9px;max-width:calc(100% - 18px);padding:7px 9px;border:1px solid rgba(241,248,238,.23);border-radius:8px;background:rgba(7,17,11,.8);color:#f5f8f1;font:850 10px/1.2 system-ui,-apple-system,sans-serif;letter-spacing:.025em;pointer-events:none}
.build-tag{position:absolute;z-index:6;right:9px;bottom:9px;padding:6px 8px;border:1px solid rgba(241,248,238,.2);border-radius:999px;background:rgba(7,17,11,.74);color:#d7e4d8;font:800 9px/1 system-ui,-apple-system,sans-serif;letter-spacing:.045em;pointer-events:none}
.control-dock{position:relative;z-index:8;width:100%;padding:10px max(10px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));border-top:1px solid rgba(237,246,237,.16);background:var(--panel);box-shadow:0 -12px 32px rgba(0,0,0,.22);backdrop-filter:blur(12px)}
.dock-inner{width:min(760px,100%);margin:0 auto}
.dock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dock-title{margin:0;color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
.dock-state{margin:0;color:var(--muted);font-size:10px;line-height:1.2;text-align:right}
.controls{display:flex;flex-wrap:wrap;gap:6px}
.controls button{flex:1 1 auto;min-width:108px}
.diagnostic-details{margin-top:9px;border-top:1px solid rgba(237,246,237,.12);padding-top:8px}

<script>

  rockLeft:'M 77 559 C 89 526 117 499 149 494 C 181 489 205 510 224 540 C 241 567 254 602 268 640 L 53 640 C 57 615 65 584 77 559 Z',
  rockCenter:'M 272 567 C 289 538 318 519 349 522 C 382 526 402 553 421 583 C 438 609 448 628 452 640 L 241 640 C 246 611 255 584 272 567 Z',
  rockRight:'M 613 570 C 634 535 667 515 702 522 C 739 530 765 563 790 592 C 806 610 820 628 828 640 L 581 640 C 584 612 594 588 613 570 Z',
  rockLowerRight:'M 832 527 C 858 503 890 493 918 502 C 943 510 958 536 960 555 L 960 640 H 813 C 816 599 818 557 832 527 Z'

const WATER_EXCLUSIONS = [
  GEOMETRY.island,
  GEOMETRY.waterfallStream,
  GEOMETRY.waterfallSpray,
  GEOMETRY.midForest,
  GEOMETRY.nearFoliageLeftShore,

  {id:'island',label:'ISLAND · STATIC',path:GEOMETRY.island,x:458,y:332,color:'#f0c66b',static:true},
  {id:'stream',label:'WATERFALL · STATIC',path:GEOMETRY.waterfallStream,x:726,y:245,color:'#9ca9f4',static:true},
  {id:'spray',label:'SPRAY · STATIC',path:GEOMETRY.waterfallSpray,x:768,y:420,color:'#c8a4df',static:true},
  {id:'wood',label:'WOOD · STATIC',path:GEOMETRY.woodUpperArch,x:330,y:168,color:'#d39a68',static:true},
  {id:'rock',label:'ROCK · STATIC',path:GEOMETRY.rockShore,x:710,y:403,color:'#b6c0b8',static:true}
];

const sceneFrameElement = document.getElementById('sceneFrame');
const sceneReference = document.getElementById('sceneReference');
const sceneRenderer = document.getElementById('sceneRenderer');
const debugOverlay = document.getElementById('debugOverlay');
const sceneStatus = document.getElementById('sceneStatus');
const dockState = document.getElementById('dockState');
const resumeButton = document.getElementById('resumeButton');
const pauseButton = document.getElementById('pauseButton');
const proofButton = document.getElementById('proofButton');
const referenceButton = document.getElementById('referenceButton');
const debugButton = document.getElementById('debugButton');
const diagnosticsButton = document.getElementById('diagnosticsButton');
const diagnosticsDetails = document.getElementById('diagnosticsDetails');
const diagnosticsNode = document.getElementById('diagnostics');

const state = {
  sourceReady:false,
  rendererReady:false,
  rendererError:'',
  proofWater:false,
  staticReference:true,
  debugGeometry:false
};

const renderer = {
  canvasContext:null,
  sourceCanvas:document.createElement('canvas'),
  sourceContext:null,
  maskCanvas:document.createElement('canvas'),
  maskContext:null,
  sourcePixels:null,
  outputImage:null,
  waterMask:null,
  boundaryWeight:null,
  width:0,
  height:0,
  scale:1,
  waterPixelCount:0,
  paths:null
};

const sceneClock = {
  running:false,
  elapsed:0,
  lastNow:null,
  rafId:0
};

const stats = {
  frames:0,
  fps:0,
  fpsWindowStart:0,
  fpsWindowFrames:0,
  lastFrameCost:0,
  averageFrameCost:0,
  totalFrameCost:0,
  maxFrameCost:0,
  viewportWidth:0,
  viewportHeight:0,
  dpr:1,
  lastDiagnosticsAt:0,
  lastResizeAt:0
};

function clamp(value,min,max){return Math.max(min,Math.min(max,value));}
function smoothstep(value){const t=clamp(value,0,1);return t*t*(3-2*t);}
function setStatus(message){sceneStatus.textContent=message;}

function initializeRendererContexts(){
  try{
    renderer.canvasContext=sceneRenderer.getContext('2d',{alpha:false,desynchronized:true});
    renderer.sourceContext=renderer.sourceCanvas.getContext('2d',{alpha:false});
    renderer.maskContext=renderer.maskCanvas.getContext('2d',{alpha:true});
  }catch(error){
    state.rendererError=String(error&&error.message||error);
    return false;
  }
  if(!renderer.canvasContext||!renderer.sourceContext||!renderer.maskContext){
    state.rendererError='Canvas2D context unavailable';
    return false;
  }
  try{
    renderer.paths={};
    Object.keys(GEOMETRY).forEach((key)=>{renderer.paths[key]=new Path2D(GEOMETRY[key]);});
  }catch(error){
    state.rendererError='Path2D geometry unavailable: '+String(error&&error.message||error);
    return false;
  }
  return true;
}

function buildBoundaryWeights(waterMask,width,height){
  const pixelCount=width*height;
  const distance=new Uint8Array(pixelCount);
  distance.fill(255);
  let waterPixelCount=0;
  for(let index=0;index<pixelCount;index+=1){
    if(!waterMask[index]) distance[index]=0;
    else waterPixelCount+=1;
  }
  const maxDistance=Math.max(7,Math.round(18*renderer.scale));
  for(let pass=1;pass<=maxDistance;pass+=1){
    let changed=false;
    for(let y=1;y<height-1;y+=1){
      const row=y*width;
      for(let x=1;x<width-1;x+=1){
        const index=row+x;
        if(!waterMask[index]||distance[index]!==255) continue;
        if(distance[index-1]===pass-1||distance[index+1]===pass-1||distance[index-width]===pass-1||distance[index+width]===pass-1||distance[index-width-1]===pass-1||distance[index-width+1]===pass-1||distance[index+width-1]===pass-1||distance[index+width+1]===pass-1){
          distance[index]=pass;
          changed=true;
        }
      }
    }
    if(!changed) break;
  }
  const weight=new Float32Array(pixelCount);
  const radius=Math.max(5,Math.round(15*renderer.scale));
  for(let index=0;index<pixelCount;index+=1){
    if(!waterMask[index]) continue;
    const distanceValue=distance[index]===255?radius+1:distance[index];
    weight[index]=smoothstep((distanceValue-1)/radius);
  }
  renderer.waterPixelCount=waterPixelCount;
  return weight;
}

function rebuildMask(){
  const width=renderer.width;
  const height=renderer.height;
  const maskContext=renderer.maskContext;
  const scale=renderer.scale;
  renderer.maskCanvas.width=width;
  renderer.maskCanvas.height=height;
  maskContext.setTransform(1,0,0,1,0,0);
  maskContext.clearRect(0,0,width,height);
  maskContext.setTransform(scale,0,0,scale,0,0);
  maskContext.fillStyle='#fff';
  maskContext.fill(renderer.paths.lake);
  maskContext.fillStyle='#000';
  WATER_EXCLUSIONS.forEach((path)=>maskContext.fill(new Path2D(path)));
  maskContext.setTransform(1,0,0,1,0,0);
  const maskPixels=maskContext.getImageData(0,0,width,height).data;
  const waterMask=new Uint8Array(width*height);
  for(let index=0,pixel=0;index<waterMask.length;index+=1,pixel+=4){
    waterMask[index]=maskPixels[pixel]>127?1:0;
  }
  renderer.waterMask=waterMask;
  renderer.boundaryWeight=buildBoundaryWeights(waterMask,width,height);
}

function configureRenderer(){
  if(!state.sourceReady||!renderer.canvasContext) return;
  const rect=sceneFrameElement.getBoundingClientRect();
  if(!rect.width||!rect.height) return;
  const targetWidth=clamp(Math.round(rect.width*INTERNAL_DENSITY),MIN_INTERNAL_WIDTH,MAX_INTERNAL_WIDTH);
  const targetHeight=Math.max(1,Math.round(targetWidth*DESIGN.height/DESIGN.width));
  const dpr=window.devicePixelRatio||1;
  stats.viewportWidth=rect.width;
  stats.viewportHeight=rect.height;
  stats.dpr=dpr;
  if(renderer.width===targetWidth&&renderer.height===targetHeight){
    updateDiagnostics();
    return;
  }
  renderer.width=targetWidth;
  renderer.height=targetHeight;
  renderer.scale=targetWidth/DESIGN.width;
  sceneRenderer.width=targetWidth;
  sceneRenderer.height=targetHeight;
  renderer.sourceCanvas.width=targetWidth;
  renderer.sourceCanvas.height=targetHeight;
  renderer.maskCanvas.width=targetWidth;
  renderer.maskCanvas.height=targetHeight;
  renderer.sourceContext.setTransform(1,0,0,1,0,0);
  renderer.sourceContext.imageSmoothingEnabled=true;
  renderer.sourceContext.clearRect(0,0,targetWidth,targetHeight);
  renderer.sourceContext.drawImage(sceneReference,0,0,targetWidth,targetHeight);
  renderer.sourcePixels=renderer.sourceContext.getImageData(0,0,targetWidth,targetHeight).data;
  renderer.outputImage=renderer.canvasContext.createImageData(targetWidth,targetHeight);
  rebuildMask();
  state.rendererReady=true;
  stats.lastResizeAt=performance.now();
  drawStaticFrame();
  updateMediaVisibility();
  updateDiagnostics();
}

function drawStaticFrame(){
  if(!state.rendererReady||!renderer.outputImage||!renderer.sourcePixels) return;
  renderer.outputImage.data.set(renderer.sourcePixels);
  renderer.canvasContext.putImageData(renderer.outputImage,0,0);
}

function sourceSampleIsWater(sx,sy){
  const width=renderer.width;
  const height=renderer.height;
  const x0=Math.floor(sx);
  const y0=Math.floor(sy);
  const x1=Math.min(width-1,x0+1);
  const y1=Math.min(height-1,y0+1);
  if(x0<0||y0<0||x0>=width||y0>=height) return false;
  const mask=renderer.waterMask;
  return Boolean(mask[y0*width+x0]&&mask[y0*width+x1]&&mask[y1*width+x0]&&mask[y1*width+x1]);
}

function renderWaterFrame(time){
  if(!state.rendererReady||!renderer.outputImage||!renderer.sourcePixels) return;
  const width=renderer.width;
  const height=renderer.height;
  const scale=renderer.scale;
  const source=renderer.sourcePixels;
  const output=renderer.outputImage.data;
  const mask=renderer.waterMask;
  const boundaryWeight=renderer.boundaryWeight;
  const proof=state.proofWater;
  const amplitudeX=(proof?26:6)*scale;
  const amplitudeY=(proof?14:3.2)*scale;
  output.set(source);
  for(let y=1;y<height-1;y+=1){
    const designY=y/scale;
    const row=y*width;
    const openWaterEnvelope=.72+.28*smoothstep((designY-250)/260);
    for(let x=1;x<width-1;x+=1){
      const index=row+x;
      const edgeWeight=boundaryWeight[index];
      if(!mask[index]||edgeWeight<=0) continue;
      const designX=x/scale;
      const phaseA=time*.93+designX*.041+designY*.017+Math.sin(designY*.022)*.72;
      const phaseB=-time*.57+designX*.015-designY*.052+Math.sin(designX*.018)*.64;
      const phaseC=time*1.37+designX*.073+designY*.029;
      const phaseD=time*.31-designX*.031+designY*.061+Math.sin((designX+designY)*.011)*.8;
      const dx=amplitudeX*edgeWeight*openWaterEnvelope*(Math.sin(phaseA)*.52+Math.sin(phaseB)*.29+Math.cos(phaseC)*.19);
      const dy=amplitudeY*edgeWeight*openWaterEnvelope*(Math.cos(phaseB)*.46+Math.sin(phaseD)*.32+Math.cos(phaseA*.43+phaseC*.21)*.22);
      let sx=x+dx;
      let sy=y+dy;
      if(!sourceSampleIsWater(sx,sy)){
        sx=x+dx*.52;
        sy=y+dy*.52;
        if(!sourceSampleIsWater(sx,sy)){
          sx=x+dx*.2;
          sy=y+dy*.2;
          if(!sourceSampleIsWater(sx,sy)){
            sx=x;
            sy=y;
          }
        }
      }
      const x0=Math.floor(sx);
      const y0=Math.floor(sy);
      const x1=Math.min(width-1,x0+1);
      const y1=Math.min(height-1,y0+1);
      const fx=sx-x0;
      const fy=sy-y0;
      const topLeft=(y0*width+x0)*4;
      const topRight=(y0*width+x1)*4;
      const bottomLeft=(y1*width+x0)*4;
      const bottomRight=(y1*width+x1)*4;
      const topWeight=1-fy;
      const bottomWeight=fy;
      const leftWeight=1-fx;
      const rightWeight=fx;
      const w00=topWeight*leftWeight;
      const w10=topWeight*rightWeight;
      const w01=bottomWeight*leftWeight;
      const w11=bottomWeight*rightWeight;
      const outputPixel=index*4;
      output[outputPixel]=source[topLeft]*w00+source[topRight]*w10+source[bottomLeft]*w01+source[bottomRight]*w11;
      output[outputPixel+1]=source[topLeft+1]*w00+source[topRight+1]*w10+source[bottomLeft+1]*w01+source[bottomRight+1]*w11;
      output[outputPixel+2]=source[topLeft+2]*w00+source[topRight+2]*w10+source[bottomLeft+2]*w01+source[bottomRight+2]*w11;
      output[outputPixel+3]=255;
    }
  }
  renderer.canvasContext.putImageData(renderer.outputImage,0,0);
}

function updateMediaVisibility(){
  sceneReference.hidden=!state.staticReference;
  sceneRenderer.hidden=state.staticReference||!state.rendererReady;
  debugOverlay.hidden=!state.debugGeometry;
  debugOverlay.classList.toggle('is-visible',state.debugGeometry);
  referenceButton.setAttribute('aria-pressed',String(state.staticReference));
  debugButton.setAttribute('aria-pressed',String(state.debugGeometry));
  proofButton.setAttribute('aria-pressed',String(state.proofWater));
  const activity=sceneClock.running?'running':'paused';
  const view=state.staticReference?'STATIC REFERENCE':'LIVE CANVAS';
  const proof=state.proofWater?' · PROOF WATER':' · normal water';
  dockState.textContent=view+' · '+activity+proof;
}

function updateDiagnostics(){
  if(!diagnosticsDetails.open) return;
  const rendererState=state.rendererReady?'ready':(state.rendererError||'waiting for source');
  diagnosticsNode.textContent=[
    'visualVerdict=manual phone review only',
    'renderer=Canvas2D ImageData displacement',
    'rendererState='+rendererState,
    'rafOwner=SceneClock top-level loop · active='+(sceneClock.running?'1':'0'),
    'frames='+stats.frames+' approxFps='+stats.fps.toFixed(1),
    'averageFrameCostMs='+stats.averageFrameCost.toFixed(2),
    'maxObservedFrameCostMs='+stats.maxFrameCost.toFixed(2),
    'lastFrameCostMs='+stats.lastFrameCost.toFixed(2),
    'viewport='+Math.round(stats.viewportWidth)+'x'+Math.round(stats.viewportHeight)+' CSS',
    'dpr='+stats.dpr.toFixed(2),
    'internalRender='+renderer.width+'x'+renderer.height,
    'waterMaskPixels='+renderer.waterPixelCount,
    'source='+SOURCE_PATH,
    'sourceSha256='+SOURCE_SHA256,
    'clockElapsedSeconds='+sceneClock.elapsed.toFixed(2),
    'visibility='+((document.hidden)?'background':'foreground')
  ].join('\n');
}

function recordFrameCost(cost,now){
  stats.frames+=1;
  stats.lastFrameCost=cost;
  stats.totalFrameCost+=cost;
  stats.averageFrameCost=stats.totalFrameCost/stats.frames;
  stats.maxFrameCost=Math.max(stats.maxFrameCost,cost);
  if(!stats.fpsWindowStart) stats.fpsWindowStart=now;
  stats.fpsWindowFrames+=1;
  if(now-stats.fpsWindowStart>=1000){
    stats.fps=stats.fpsWindowFrames*1000/(now-stats.fpsWindowStart);
    stats.fpsWindowFrames=0;
    stats.fpsWindowStart=now;
  }
}

function scheduleSceneFrame(){
  if(sceneClock.rafId===0&&sceneClock.running&&!document.hidden) sceneClock.rafId=requestAnimationFrame(renderLoop);
}

function renderLoop(now){
  sceneClock.rafId=0;
  if(!sceneClock.running||document.hidden) return;
  if(sceneClock.lastNow!==null){
    sceneClock.elapsed+=Math.min(.1,Math.max(0,(now-sceneClock.lastNow)/1000));
  }
  sceneClock.lastNow=now;
  const frameStarted=performance.now();
  renderWaterFrame(sceneClock.elapsed);
  recordFrameCost(performance.now()-frameStarted,now);
  if(diagnosticsDetails.open&&now-stats.lastDiagnosticsAt>=500){
    stats.lastDiagnosticsAt=now;
    updateDiagnostics();
  }
  scheduleSceneFrame();
}

function resumeScene(){
  if(!state.sourceReady||!state.rendererReady){
    setStatus('WAITING · approved source has not finished loading.');
    return;
  }
  if(state.staticReference){
    state.staticReference=false;
    updateMediaVisibility();
  }
  if(sceneClock.running) return;
  sceneClock.running=true;
  sceneClock.lastNow=performance.now();
  setStatus(state.proofWater?'PROOF WATER · real lake pixels moving · anchors remain masked':'LIVE WATER · real lake pixels moving');
  updateMediaVisibility();
  scheduleSceneFrame();
  updateDiagnostics();
}

function pauseScene(message){
  sceneClock.running=false;
  sceneClock.lastNow=null;
  if(sceneClock.rafId!==0){
    cancelAnimationFrame(sceneClock.rafId);
    sceneClock.rafId=0;
  }
  if(message) setStatus(message);
  updateMediaVisibility();
  updateDiagnostics();
}

function toggleProofWater(){
  state.proofWater=!state.proofWater;
  if(state.staticReference){
    state.staticReference=false;
    updateMediaVisibility();
  }
  if(!sceneClock.running) resumeScene();
  else setStatus(state.proofWater?'PROOF WATER · strong photographic pixel displacement':'NORMAL WATER · reduced photographic pixel displacement');
  updateMediaVisibility();
}

function toggleStaticReference(){
  state.staticReference=!state.staticReference;
  if(state.staticReference){
    pauseScene('STATIC REFERENCE · untouched approved image');
  }else{
    drawStaticFrame();
    setStatus('LIVE CANVAS · tap START / RESUME to animate real lake pixels');
    updateMediaVisibility();
  }
  updateDiagnostics();
}

function createDebugGeometry(){
  const svgNamespace='http://www.w3.org/2000/svg';
  DEBUG_REGIONS.forEach((region)=>{
    const path=document.createElementNS(svgNamespace,'path');
    path.setAttribute('class','debug-path'+(region.water?' is-water':'')+(region.static?' is-static':''));
    path.setAttribute('d',region.path);
    path.setAttribute('stroke',region.color);
    path.dataset.region=region.id;
    debugOverlay.appendChild(path);
    const labelGroup=document.createElementNS(svgNamespace,'g');
    labelGroup.setAttribute('class','debug-label');
    const textWidth=Math.max(96,region.label.length*7.2);
    const rect=document.createElementNS(svgNamespace,'rect');
    rect.setAttribute('x',String(region.x-5));
    rect.setAttribute('y',String(region.y-17));
    rect.setAttribute('width',String(textWidth));
    rect.setAttribute('height','23');
    rect.setAttribute('rx','4');
    const text=document.createElementNS(svgNamespace,'text');
    text.setAttribute('x',String(region.x));
    text.setAttribute('y',String(region.y));
    text.textContent=region.label;
    labelGroup.appendChild(rect);
    labelGroup.appendChild(text);
    debugOverlay.appendChild(labelGroup);
  });
}

function toggleDebugGeometry(){
  state.debugGeometry=!state.debugGeometry;
  updateMediaVisibility();
  setStatus(state.debugGeometry?'DEBUG GEOMETRY · cyan lake mask, amber static anchors':'DEBUG GEOMETRY OFF · review image pixels directly');
}

function handleVisibilityChange(){
  if(document.hidden){
    if(sceneClock.rafId!==0){
      cancelAnimationFrame(sceneClock.rafId);
      sceneClock.rafId=0;
    }
    sceneClock.lastNow=null;
    updateDiagnostics();
    return;
  }
  if(sceneClock.running){
    sceneClock.lastNow=performance.now();
    setStatus(state.proofWater?'FOREGROUND · PROOF WATER resumed':'FOREGROUND · live water resumed');
    scheduleSceneFrame();
  }
  updateDiagnostics();
}

function handleResize(){
  configureRenderer();
  if(!state.staticReference&&!sceneClock.running) drawStaticFrame();
}

function handleSourceReady(){
  state.sourceReady=true;
  if(!initializeRendererContexts()){
    setStatus('ERROR · Canvas2D renderer unavailable: '+state.rendererError);
    updateDiagnostics();
    return;
  }
  configureRenderer();
  setStatus('STATIC REFERENCE · approved source ready · tap PROOF WATER');
  updateMediaVisibility();
  updateDiagnostics();
}

sceneReference.addEventListener('load',handleSourceReady,{once:true});
sceneReference.addEventListener('error',()=>{
  state.rendererError='approved source failed to load';
  setStatus('ERROR · approved source failed to load');
  updateDiagnostics();
},{once:true});
resumeButton.addEventListener('click',resumeScene);
pauseButton.addEventListener('click',()=>pauseScene('PAUSED · frame held for anchor inspection'));
proofButton.addEventListener('click',toggleProofWater);
referenceButton.addEventListener('click',toggleStaticReference);
debugButton.addEventListener('click',toggleDebugGeometry);
diagnosticsButton.addEventListener('click',()=>{
  diagnosticsDetails.open=!diagnosticsDetails.open;
  diagnosticsButton.setAttribute('aria-expanded',String(diagnosticsDetails.open));
  updateDiagnostics();
});
diagnosticsDetails.addEventListener('toggle',()=>{
  diagnosticsButton.setAttribute('aria-expanded',String(diagnosticsDetails.open));
  updateDiagnostics();
});
document.addEventListener('visibilitychange',handleVisibilityChange);
window.addEventListener('resize',handleResize,{passive:true});

createDebugGeometry();
updateMediaVisibility();
updateDiagnostics();
if(sceneReference.complete&&sceneReference.naturalWidth) handleSourceReady();
</script>
</body>
</html>
