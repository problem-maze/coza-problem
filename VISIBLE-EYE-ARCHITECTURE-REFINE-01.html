<title>Visible Eye — Architecture Refine 01</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED VISUAL-DESIGN STUDY — ARCHITECTURE REFINE 01.
     Not connected to production. Geometry only — no color, no glow,
     no motion, no UI, no labels inside the eye.

     Single controlled refinement of Lab 01's "A — Layered Precision"
     direction (the chosen base). Not a new branch, not a return to
     three options. B's asymmetric-fragment-cluster idea is not used
     anywhere here. A limited amount is borrowed from C: one macro-
     scale element and two small, earned micro-detail clusters —
     nothing else from C carries over.

     What changed from A, and why:
     · Six nested faceted rings, same "open bracket" language as A,
       but each layer's vertices now carry a small fixed radius
       jitter (a short reused offset sequence, not randomness) —
       this is what moves the piece from "regular polygon / contour
       ring" toward "faceted, composed shape" without discarding the
       underlying order.
     · Radii are unevenly spaced and edge counts are not a strict
       arithmetic progression — a deliberately imperfect rhythm
       reads as considered rather than mechanically generated.
     · One macro bracket (borrowed from C) sits at a radius BETWEEN
       two of the nested layers rather than outside all of them, so
       its edges visibly cross the regular nesting — this is the
       actual source of added depth: real line intersection, not a
       parallel seventh ring.
     · Two edges (one per two different layers) are redrawn bolder —
       local emphasis inside an otherwise even ring, not a new
       element.
     · Two small tick clusters (from C's micro-scale idea) sit only
       where the macro bracket actually crosses the nested layers —
       detail placed where it is earned, not spread evenly.
     · The three witness lines and the sparse cross-layer ties are
       unchanged from A — they are what still reads six-plus-one
       shapes as one composed object.

     LOCKED: outer lid silhouette, pupil anchor and size, overall
     proportions, calm negative space, monochrome graphite, the lens
     clipPath that keeps every mark inside the eye's actual opening.
     ══════════════════════════════════════════════════════════════ */

  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }

</style>
