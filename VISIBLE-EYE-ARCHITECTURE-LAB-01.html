<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED VISUAL-DESIGN STUDY — ARCHITECTURE LAB 01.
     Not connected to production. Geometry only — no color, no glow,
     no motion, no UI, no labels inside the eye.

     A deliberate reset from every prior lab in this series. Those
     built internal geometry as an encoded system (route logic,
     relationship logic, resolution gradients) and then asked whether
     the result looked good. This lab reverses the order: three
     internal architectures composed purely as visual design —
     judged on hierarchy, rhythm, balance, complexity, depth and
     continuity — with no semantic layer attached to any mark.
     Nothing here stands for reasoning, understanding, or a route.

     A — LAYERED PRECISION: six faceted rings (regular polygons, not
     circles), each rotated against the last and left open at one
     edge, facet count and ink both increasing toward the center.
     Three straight witness lines pass through every layer at fixed
     angles — the device that reads the nested rings as one composed
     instrument rather than six separate shapes.

     B — ASYMMETRIC CONSTRUCT: one dense cluster of overlapping
     angular facets, upper-left, with one facet weighted boldest to
     anchor it. Its visual mass is balanced — not mirrored — by a
     lighter, wider field of fine measured strokes lower-right. A
     single connecting stroke ties the cluster toward the pupil's
     neighbourhood without centering on it.

     C — INTEGRATED COMPLEX FIELD: three genuinely different scales
     in one composition — two bold, asymmetric macro sweeps; one
     faceted medium ring with two of its own edges emphasized; small
     graduation clusters only where macro and medium actually sit
     close together. Two witness lines tie the scales into a single
     object the same way they do in A.

     LOCKED across all three: outer lid silhouette, pupil anchor and
     size, overall proportions, calm negative space, monochrome
     graphite, the lens clipPath that keeps every mark inside the
     eye's actual opening.
     ══════════════════════════════════════════════════════════════ */

  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }

</style>
