<title>Visible Eye — Concept Reset 02</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED GEOMETRY STUDY — CONCEPT RESET 02.
     Not connected to production: no heroEyeSvg / HeroV1Life /
     AtmosphereGL / Journey / Q-A reference anywhere in this file.
     Geometry only — no color, no glow, no motion, no UI, no badge.

     Reset 01 proved one grammar removes the "assembled diagram"
     feeling, but a single spiral pitch applied uniformly everywhere
     reads as an elegant orbital swirl — decorative, not a field
     under tension. This pass keeps the one grammar (a fragment of a
     logarithmic spiral wound around the pupil, r = r0*e^(-bθ)) but
     lets that fragment BEHAVE differently across three zones, which
     is what introduces hierarchy and tension without introducing a
     second kind of mark:

     · OUTER FIELD  — low curvature (b reduced ~40%), so fragments
       sit closer to their own radius than pulling inward. About a
       third of them are drawn turning the OPPOSITE rotational
       direction from the rest. That's the tension: the outer field
       doesn't agree with itself yet.
     · MID FIELD    — moderate curvature, one shared direction now
       (the disagreement is resolving), but roughly half the
       fragments are drawn as TWO pieces with a gap instead of one
       continuous stroke — reasoning that hasn't fully connected.
     · CONVERGENCE  — tight curvature, dense, always continuous.
       The one zone where nothing is left unresolved.

     Three fragments in the mid zone are the exception to "broken":
     left whole and given extra reach toward the convergence. Same
     weight family, same alpha curve as their neighbours — nothing
     marks them as special. That is the entire treatment of route
     logic: a few threads are more continuous than the rest, sensed
     rather than illustrated.

     Placement is stratified (N even angular sectors, golden-angle
     jitter within each) rather than a raw golden-angle sequence, so
     coverage is even in every direction instead of leaving a
     hemisphere sparser by chance.

     LOCKED, unchanged: outer lid silhouette, pupil anchor and size,
     overall proportions, calm negative space, monochrome graphite,
     the lens clipPath that keeps the field inside the eye's actual
     opening.
     ══════════════════════════════════════════════════════════════ */

  html,body{
    background:#f4f5f7; color:#1e2430;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 24px;
  }
  .stage{ width:840px; max-width:100%; background:#ffffff; border:1px solid #e4e6ea; border-radius:20px; padding:28px 22px; }
  .stage svg{ display:block; width:100%; height:auto; }
  .eye-lid{ fill:none; stroke:#232936; stroke-width:2.2; stroke-linecap:round; }
  .eye-pupil{ fill:#232936; }
</style>
