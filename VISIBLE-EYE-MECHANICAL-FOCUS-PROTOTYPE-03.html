<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible Eye — Mechanical Focus Prototype 03</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     MECHANICAL FOCUS PROTOTYPE 03 — internal mechanical architecture
     pass. Prototype 02 is the protected baseline: viewBox, outer
     almond, optical center, #eyeAssembly footprint, all six ring
     radii-as-semantic-levels, #focusCore/#opticalChamber/#leftControl/
     #rightBridge ids, state engine, API, reduced-motion and debug
     mechanisms all survive (see the NOTE for the exact preservation
     matrix). This pass works to make the mechanism read as ONE
     coherent machine rather than a core with decorative concentric
     arcs: the internal geometry is scaled up ~13% for mobile
     legibility, ring segments are deliberately irregular in length
     and gate placement (breaking the "radar" reading), a single
     red signal path threads core -> chamber -> r1/r2 -> r3/r4 ->
     bridge, and four explicit front/back occlusion relationships were
     added. No production file is read from or written to at runtime.
     Prototype 02 itself was not modified to build this file.
     ══════════════════════════════════════════════════════════════ */
  *{margin:0;padding:0;box-sizing:border-box}
  html{ width:100%; overflow-x:hidden; background:#FAFBFD; }
  body{
    width:100%; min-height:100vh; overflow-x:hidden;
    background:#FAFBFD; color:#30333A;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:48px 24px;
  }
  .stage{
    width:720px; max-width:100%; background:#FFFFFF;
    border:1px solid #E4E7EC; border-radius:20px; padding:28px 22px;
  }
  .stage svg{ display:block; width:100%; height:auto; }
  @media (max-width:480px){
    body{ padding:14px; }
    .stage{ border:none; border-radius:0; background:transparent; padding:0; }
  }

  svg.mech-eye{
    --bg:#FAFBFD;
    --surface:#FFFFFF;
    --ink:#30333A;
    --support:#777A82;
    --quiet:#C4C8CF;
    --red-base:#B95B5A;
    --red-100: var(--red-base);
    --red-78: color-mix(in srgb, var(--red-base) 78%, var(--bg) 22%);
    --red-50: color-mix(in srgb, var(--red-base) 50%, var(--bg) 50%);
    --red-26: color-mix(in srgb, var(--red-base) 26%, var(--bg) 74%);
    --core: #14161B;
  }

  /* ── frame (unchanged) ── */
  .eye-lid-upper{ fill:none; stroke:var(--ink); stroke-width:5; stroke-linecap:round; stroke-opacity:0.95; }
  .eye-lid-lower{ fill:none; stroke:var(--ink); stroke-width:5; stroke-linecap:round; stroke-opacity:0.80; }

  /* ── quiet measurement field (unchanged) ── */
  .qmf-axis{ fill:none; stroke:var(--quiet); stroke-width:1.2; stroke-opacity:0.18; stroke-dasharray:2 7; }
  .qmf-diag{ fill:none; stroke:var(--quiet); stroke-width:1; stroke-opacity:0.12; stroke-dasharray:2 9; }
  .qmf-circle{ fill:none; stroke:var(--quiet); stroke-width:1; stroke-opacity:0.14; stroke-dasharray:3 8; }
  .qmf-circle-outer{ stroke-opacity:0.09; }
  .qmf-axisdot circle:first-child{ fill:none; stroke:var(--quiet); stroke-width:1.4; stroke-opacity:0.4; }
  .qmf-axisdot-core{ fill:var(--red-100); opacity:0.6; }
  .qmf-topmark{ fill:none; stroke:var(--quiet); stroke-width:1.4; stroke-opacity:0.35; transition:stroke-opacity 0.6s ease; }

  /* ── left control assembly: scaled, strengthened gate ── */
  .lc-sleeve{ fill:var(--support); opacity:0.12; }
  .lc-bracket{ fill:none; stroke:var(--support); stroke-width:3.4; stroke-linecap:round; stroke-opacity:0.72;
    transform-box:fill-box; transform-origin:center; transition:transform 0.5s cubic-bezier(0.4,0,0.2,1); }
  .lc-connector{ fill:none; stroke:var(--support); stroke-width:3; stroke-opacity:0.6; }
  .lc-dot{ fill:var(--bg); stroke:var(--support); stroke-width:2.2; stroke-opacity:0.72; }
  .lc-dot-active{ fill:var(--red-100); stroke:var(--red-100); opacity:0.85; transition:opacity 0.5s ease; }

  /* ── right process bridge: scaled, strengthened gateway ── */
  .rb-sleeve{ fill:var(--support); opacity:0.12; }
  .rb-line{ fill:none; stroke:var(--support); stroke-width:3.4; stroke-opacity:0.66; }
  .rb-signal-ring{ fill:none; stroke:var(--red-78); stroke-width:1.8; stroke-opacity:0.5; transition:stroke-opacity 0.5s ease; }
  .rb-signal{ fill:var(--red-100); opacity:0.75; transition:opacity 0.5s ease, r 0.5s ease; }
  .rb-terminal{ fill:none; stroke:var(--support); stroke-width:3.4; stroke-linecap:round; stroke-opacity:0.5; }
  .rb-terminal-anchor{ fill:none; stroke:var(--support); stroke-width:2.2; stroke-linecap:round; stroke-opacity:0.4; }

  /* ── segmented operation rings (6 protected levels, irregular + occluded) ── */
  .seg{ fill:none; stroke-linecap:round; transition:stroke-opacity 0.5s ease; }
  .channel-backing{ fill:none; stroke:var(--ink); stroke-opacity:0.35; stroke-linecap:round; }
  .plate{ fill:none; stroke:var(--surface); stroke-opacity:0.97; stroke-linecap:round; transition:stroke-opacity 0.5s ease; }
  .connector-bridge{ fill:none; stroke:var(--support); stroke-width:2.2; stroke-opacity:0.5; stroke-linecap:round; }
  .connector-signal{ stroke:var(--red-78); stroke-opacity:0.7; }
  .gate-emergence-cap{ fill:var(--ink); opacity:0.3; }
  .chamber-link{ fill:none; stroke:var(--support); stroke-width:1.8; stroke-opacity:0.4; stroke-linecap:round; }
  .chamber-link-signal{ stroke:var(--red-78); stroke-opacity:0.55; }
  .counter-signal{ transition:stroke-opacity 0.5s ease; }
  .ring-gate{ transform-box:fill-box; transform-origin:center; transition:transform 0.5s cubic-bezier(0.4,0,0.2,1); }
  .ring-level[data-ring="r1"]{ opacity:1; }
  .ring-level[data-ring="r2"]{ opacity:0.95; }
  .ring-level[data-ring="r3"]{ opacity:0.89; }
  .ring-level[data-ring="r4"]{ opacity:0.82; }
  .ring-level[data-ring="r5"]{ opacity:0.74; }
  .ring-level[data-ring="r6"]{ opacity:0.66; }
  .role-ink{ stroke:var(--ink); stroke-opacity:0.85; }
  .role-support{ stroke:var(--support); stroke-opacity:0.75; }
  .role-quiet{ stroke:var(--quiet); stroke-opacity:0.55; }
  .role-red-100{ stroke:var(--red-100); stroke-opacity:0.95; }
  .role-red-78{ stroke:var(--red-78); stroke-opacity:0.85; }
  .role-red-50{ stroke:var(--red-50); stroke-opacity:0.7; }
  .role-red-26{ stroke:var(--red-26); stroke-opacity:0.5; }

  /* ── inner optical chamber (protected id, scaled + more connected) ── */
  .chamber-boundary{ fill:none; stroke:var(--ink); stroke-width:2.2; stroke-opacity:0.5; }
  .chamber-boundary-outer{ stroke:var(--quiet); stroke-width:1.8; stroke-opacity:0.5; }
  .chamber-boundary-inner{ stroke:#FFFFFF; stroke-width:2.2; stroke-opacity:0.88; }
  .tick{ stroke:var(--support); stroke-width:1.8; stroke-opacity:0.55; }
  .tick-major{ stroke:var(--ink); stroke-width:2.2; stroke-opacity:0.72; }
  .chamber-orientation-signal{ fill:var(--red-100); opacity:0.88; transition:opacity 0.5s ease, transform 0.5s cubic-bezier(0.4,0,0.2,1);
    transform-box:fill-box; transform-origin:center; }

  /* ── central focus core (protected id, scaled + sharpened catchlight hierarchy) ── */
  .core-rim{ fill:none; stroke:#FFFFFF; stroke-width:2.7; stroke-opacity:0.92;
    transition:stroke-opacity 0.5s ease, stroke-width 0.5s ease; }
  .core-chamber{ fill:url(#coreChamberGrad); }
  .core-body{ fill:url(#corePupilGrad); }
  .core-reflection-soft{ fill:url(#softReflectionGrad); }
  .core-shadow-lower{ fill:#000000; opacity:0.24; }
  .catchlight{ fill:#FFFFFF; transform-box:fill-box; transform-origin:center;
    transition:opacity 0.5s ease, transform 0.55s cubic-bezier(0.4,0,0.2,1); }
  .catchlight-primary{ opacity:1; }
  .catchlight-secondary{ opacity:0.6; }

  /* ══ semantic state deltas — calm, one-shot, never continuous; bigger and
     more spatially meaningful than Prototype 02 (2-5px / ~1.5deg) ══ */
  /* watching (baseline / stage 01 — ANALYZING): no overrides, this IS the resting look */

  /* searching (stage 02 — TRACING): chamber signal advances, the red path
     progresses outward through r3/r4, inner gates shift, bridge attends */
  #eyeAssembly.state-searching #catchlightPrimary{ transform:translate(2.4px,-1.8px); }
  #eyeAssembly.state-searching .chamber-orientation-signal{ opacity:1; transform:translate(3px,-2px) rotate(4deg); }
  #eyeAssembly.state-searching .chamber-link-signal{ stroke-opacity:0.85; }
  #eyeAssembly.state-searching .ring-level[data-ring="r3"] .role-red-78{ stroke-opacity:0.95; }
  #eyeAssembly.state-searching .connector-signal{ stroke-opacity:0.95; }
  #eyeAssembly.state-searching .ring-gate[data-gate="right"]{ transform:translateX(3px) rotate(1deg); }
  #eyeAssembly.state-searching #bridgeSignal{ opacity:0.95; r:7.4; }
  #eyeAssembly.state-searching .rb-signal-ring{ stroke-opacity:0.75; }
  #eyeAssembly.state-searching .plate.role-gateway-plate{ stroke-opacity:1; }

  /* found (stage 03 — PATH FOUND): a route from chamber through the middle
     architecture clearly aligns; left gate moves; right gateway opens */
  #eyeAssembly.state-found .lc-bracket{ transform:translateX(-5px) rotate(-1.2deg); }
  #eyeAssembly.state-found .ring-gate[data-gate="left"]{ transform:translateX(-4px); }
  #eyeAssembly.state-found .ring-gate[data-gate="right"]{ transform:translateX(4px) rotate(1.5deg); }
  #eyeAssembly.state-found .core-reflection-soft{ opacity:0.65; transform:scale(0.92); }
  #eyeAssembly.state-found .ring-level[data-ring="r3"] .role-ink{ stroke-opacity:0.95; }
  #eyeAssembly.state-found #bridgeSignal{ opacity:1; r:8.4; }
  #eyeAssembly.state-found .rb-signal-ring{ stroke-opacity:0.9; }

  /* solved (stage 04 — SOLVED): fragments settle toward a clean structural
     path; red CONCENTRATES (periphery dims rather than everything brightening) */
  #eyeAssembly.state-solved .core-rim{ stroke-opacity:1; stroke-width:3.4; }
  #eyeAssembly.state-solved .role-red-100{ stroke-opacity:1; }
  #eyeAssembly.state-solved .role-red-78{ stroke-opacity:0.95; }
  #eyeAssembly.state-solved .role-red-50{ stroke-opacity:0.85; }
  #eyeAssembly.state-solved .counter-signal{ stroke-opacity:0.3; }
  #eyeAssembly.state-solved .lc-dot-active{ opacity:1; }
  #eyeAssembly.state-solved .chamber-boundary-inner{ stroke-opacity:1; }
  #eyeAssembly.state-solved .plate{ stroke-opacity:1; }
  #eyeAssembly.state-solved .ring-gate{ transform:translateX(0) rotate(0.6deg); }

  /* embodied (stage 05 — EMBODIED): deepest, quietest presence; core material
     richer, ring hierarchy unifies slightly, no burst */
  #eyeAssembly.state-embodied .catchlight-primary{ opacity:1; transform:scale(1.08); }
  #eyeAssembly.state-embodied .catchlight-secondary{ opacity:0.75; }
  #eyeAssembly.state-embodied .qmf-topmark{ stroke-opacity:0.55; }
  #eyeAssembly.state-embodied .core-rim{ stroke-width:3.6; stroke-opacity:1; }
  #eyeAssembly.state-embodied .core-body{ fill:url(#corePupilGradEmbodied); }
  #eyeAssembly.state-embodied .ring-level[data-ring="r5"]{ opacity:0.82; }
  #eyeAssembly.state-embodied .ring-level[data-ring="r6"]{ opacity:0.76; }

  /* idle (system at rest / cleared, mirrors production's all-classes-removed
     state): red recedes substantially; graphite stays fully readable */
  #eyeAssembly.state-idle .role-red-100,
  #eyeAssembly.state-idle .role-red-78,
  #eyeAssembly.state-idle .role-red-50,
  #eyeAssembly.state-idle .role-red-26{ stroke-opacity:0.18; }
  #eyeAssembly.state-idle .counter-signal{ stroke-opacity:0.12; }
  #eyeAssembly.state-idle #bridgeSignal{ opacity:0.3; }
  #eyeAssembly.state-idle .rb-signal-ring{ stroke-opacity:0.2; }
  #eyeAssembly.state-idle .lc-dot-active{ opacity:0.38; }
  #eyeAssembly.state-idle .chamber-orientation-signal{ opacity:0.28; }
  #eyeAssembly.state-idle .chamber-link-signal{ stroke-opacity:0.2; }
  #eyeAssembly.state-idle .connector-signal{ stroke-opacity:0.25; }

  /* Motion is gated by VisibleEyeLife: only plays while the tab is visible,
     the assembly is in view, and the user has not requested reduced motion.
     Otherwise every state is still fully legible, just reached instantly. */
  html:not(.eye-motion-ok) #eyeAssembly *{ transition:none !important; }
  @media (prefers-reduced-motion:reduce){
    #eyeAssembly *{ transition:none !important; }
  }

  /* ── debug panel (built by JS only when ?debug=1; absent from normal DOM) ── */
  #eyeDebugPanel{
    position:fixed; right:16px; bottom:16px; z-index:9999;
    background:#FFFFFF; border:1px solid #E4E7EC; border-radius:14px;
    padding:12px 14px; font:12px/1.4 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    width:200px;
  }
  #eyeDebugPanel h4{ font-size:11px; text-transform:uppercase; letter-spacing:0.04em; color:#777A82; margin-bottom:8px; }
  #eyeDebugPanel button{
    display:block; width:100%; margin-bottom:6px; padding:6px 8px;
    border:1px solid #E4E7EC; border-radius:8px; background:#FAFBFD; color:#30333A;
    font-size:12px; cursor:pointer; text-align:left;
  }
  #eyeDebugPanel button:hover{ background:#F0F1F4; }
  #eyeDebugPanel button.is-active{ border-color:#B95B5A; color:#B95B5A; }
  #eyeDebugPanel .eye-debug-readout{ margin-top:6px; color:#777A82; font-size:11px; }
</style>
</head>
<body>
  <div class="stage">
    <svg class="mech-eye" viewBox="-760 -440 1520 880" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- restrained gradients, scoped to the focus core and its immediate
             rim only — no gradients appear anywhere else in the piece. -->
        <radialGradient id="coreChamberGrad" cx="42%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#2A2D34"/>
          <stop offset="100%" stop-color="#1A1C22"/>
        </radialGradient>
        <radialGradient id="corePupilGrad" cx="45%" cy="40%" r="70%">
          <stop offset="0%" stop-color="#22242B"/>
          <stop offset="55%" stop-color="#0E0F13"/>
          <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
        <radialGradient id="corePupilGradEmbodied" cx="45%" cy="40%" r="70%">
          <stop offset="0%" stop-color="#24262E"/>
          <stop offset="55%" stop-color="#07080A"/>
          <stop offset="100%" stop-color="#000000"/>
        </radialGradient>
        <radialGradient id="softReflectionGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
        </radialGradient>
      </defs>

      <g id="eyeAssembly" class="state-watching">

        <!-- quiet measurement field (unchanged) -->
        <g class="qmf">
          <path class="qmf-axis" d="M -696,0 L 696,0"/>
          <path class="qmf-axis" d="M 0,-345.9 L 0,364.3"/>
          <path class="qmf-diag" d="M -450.1,-233.1 L 450.1,245.5"/>
          <path class="qmf-diag" d="M -450.1,245.5 L 450.1,-233.1"/>
          <circle class="qmf-circle" cx="0" cy="0" r="340"/>
          <circle class="qmf-circle qmf-circle-outer" cx="0" cy="0" r="410"/>
          <g class="qmf-axisdot" transform="translate(-538.7,0)"><circle r="13"/><circle class="qmf-axisdot-core" r="3.5"/></g>
          <g class="qmf-axisdot" transform="translate(538.7,0)"><circle r="13"/><circle class="qmf-axisdot-core" r="3.5"/></g>
          <circle class="qmf-topmark" cx="0" cy="-327.1" r="10"/>
        </g>

        <!-- outer almond frame (unchanged) -->
        <path class="eye-lid-upper" d="M -726 0 Q 0 -752, 726 0"/>
        <path class="eye-lid-lower" d="M -726 0 Q 0 792, 726 0"/>

        <!-- left control assembly (protected id, scaled + strengthened gate) -->
        <g id="leftControl" class="left-control">
          <path class="lc-sleeve" d="M -330,-34 L -274,-34 L -274,34 L -330,34 Z"/>
          <path class="lc-bracket" d="M -305,-45 L -330,-45 L -330,45 L -305,45"/>
          <path class="lc-connector" d="M -274,0 L -305,0"/>
          <circle class="lc-dot" cx="-350" cy="-37" r="6.2"/>
          <circle id="indicatorActive" class="lc-dot lc-dot-active" cx="-350" cy="-12" r="6.2"/>
          <circle class="lc-dot" cx="-350" cy="12" r="6.2"/>
          <circle class="lc-dot" cx="-350" cy="37" r="6.2"/>
        </g>

        <!-- right process bridge (protected id, scaled + strengthened gateway) -->
        <g id="rightBridge" class="right-bridge">
          <path class="rb-sleeve" d="M 224,-18 L 285,-18 L 285,18 L 224,18 Z"/>
          <path class="rb-line" d="M 278,0 L 429,0"/>
          <circle class="rb-signal-ring" cx="373" cy="0" r="12.4"/>
          <circle id="bridgeSignal" class="rb-signal" cx="373" cy="0" r="6.8"/>
          <path class="rb-terminal" d="M 429,-16 L 429,16"/>
          <path class="rb-terminal-anchor" d="M 429,-16 L 443,-16 M 429,16 L 443,16"/>
        </g>

        <!-- segmented operation rings (6 protected levels: r1-r6; deliberately
             irregular spans, occlusion pairs, and gate groups nested inside
             their owning level so depth-taper opacity still applies correctly) -->
        <g class="ring-system">
          <g class="ring-level" data-ring="r1">
            <path class="seg role-ink" d="M 155.6,27.44 A 158,158 0 0 1 -105.72,117.42" stroke-width="11"/>
            <path class="seg role-ink" d="M -121.04,101.56 A 158,158 0 0 1 -155.6,27.44" stroke-width="11"/>
            <path class="seg role-ink" d="M -155.6,-27.44 A 158,158 0 0 1 -88.35,-130.99" stroke-width="11"/>
            <path class="seg role-red-78" d="M -5.51,-157.9 A 158,158 0 0 1 92.87,-127.82" stroke-width="11"/>
            <path class="seg role-red-100" d="M 105.72,-117.42 A 158,158 0 0 1 157.13,-16.52" stroke-width="11"/>
          </g>
          <g class="ring-level" data-ring="r2">
            <path class="seg role-support" d="M 173.03,49.61 A 180,180 0 0 1 95.39,152.65" stroke-width="9.5"/>
            <path class="seg role-support" d="M 73.21,164.44 A 180,180 0 0 1 -155.88,90.0" stroke-width="9.5"/>
            <path class="seg role-support" d="M -173.03,-49.61 A 180,180 0 0 1 -55.62,-171.19" stroke-width="9.5"/>
            <path class="seg role-red-26 counter-signal" d="M -169.14,61.56 A 180,180 0 0 1 -178.25,25.05" stroke-width="9.5"/>
            <g class="occlusion-pair">
              <path class="channel-backing" d="M 137.89,-115.7 A 180,180 0 0 1 178.25,-25.05" stroke-width="12.5"/>
              <path class="seg role-red-100" d="M 137.89,-115.7 A 180,180 0 0 1 178.25,-25.05" stroke-width="6"/>
            </g>
          </g>
          <g class="ring-level" data-ring="r3">
            <path class="seg role-ink" d="M 192.11,62.42 A 202,202 0 0 1 88.55,181.56" stroke-width="8.6"/>
            <path class="seg role-ink" d="M 62.42,192.11 A 202,202 0 0 1 -197.59,42.0" stroke-width="8.6"/>
            <path class="seg role-support" d="M -200.03,-28.11 A 202,202 0 0 1 -167.47,-112.96" stroke-width="8.6"/>
            <path class="seg role-support" d="M -150.12,-135.16 A 202,202 0 0 1 101.0,-174.94" stroke-width="8.6"/>
            <path class="seg role-red-78" d="M 174.94,-101.0 A 202,202 0 0 1 198.93,-35.08" stroke-width="8.6"/>
          </g>
          <g class="ring-level" data-ring="r4">
            <path class="seg role-support" d="M 210.49,76.61 A 224,224 0 0 1 137.91,176.51" stroke-width="7.6"/>
            <path class="seg role-support" d="M 112.0,193.99 A 224,224 0 0 1 -193.99,112.0" stroke-width="7.6"/>
            <path class="seg role-quiet" d="M -224.0,0.0 A 224,224 0 0 1 -166.46,-149.89" stroke-width="7.6"/>
            <path class="seg role-quiet" d="M -137.91,-176.51 A 224,224 0 0 1 -0.0,-224.0" stroke-width="7.6"/>
            <path class="seg role-red-50" d="M 98.2,-201.33 A 224,224 0 0 1 207.69,-83.91" stroke-width="7.6"/>
            <g class="ring-gate" data-gate="right">
              <path class="channel-backing" d="M 207.69,-83.91 A 224,224 0 0 1 210.49,76.61" stroke-width="10.8"/>
              <path class="plate role-gateway-plate" d="M 207.69,-83.91 A 224,224 0 0 1 210.49,76.61" stroke-width="8.8"/>
            </g>
          </g>
          <g class="ring-level" data-ring="r5">
            <path class="seg role-quiet" d="M 222.9,108.72 A 248,248 0 0 1 84.82,233.04" stroke-width="6.8"/>
            <path class="seg role-quiet" d="M 51.56,242.58 A 248,248 0 0 1 -247.85,8.66" stroke-width="6.8"/>
            <path class="seg role-quiet" d="M -222.9,-108.72 A 248,248 0 0 1 233.04,-84.82" stroke-width="6.8"/>
          </g>
          <g class="ring-level" data-ring="r6">
            <path class="seg role-quiet" d="M 227.16,153.22 A 274,274 0 0 1 -237.29,137.0" stroke-width="6.2"/>
            <path class="seg role-quiet" d="M -250.31,-111.45 A 274,274 0 0 1 -145.2,-232.37" stroke-width="6.2"/>
            <path class="seg role-quiet" d="M -111.45,-250.31 A 274,274 0 0 1 250.31,-111.45" stroke-width="6.2"/>
            <g class="ring-gate" data-gate="left">
              <path class="channel-backing" d="M -237.29,137.0 A 274,274 0 0 1 -250.31,-111.45" stroke-width="9.8"/>
              <path class="plate role-left-gate-plate" d="M -237.29,137.0 A 274,274 0 0 1 -250.31,-111.45" stroke-width="7.8"/>
            </g>
          </g>
        </g>

        <!-- connector bridges: 5 physical links crossing gaps between
             levels, deliberately non-matching angles; 2 carry the red
             signal path forward (r1->r2, r3->r4), 3 stay graphite -->
        <g class="ring-connectors">
          <path class="connector-bridge connector-signal" d="M 121.04,-101.56 L 137.89,-115.7"/>
          <path class="connector-bridge" d="M 155.88,90.0 L 174.94,101.0"/>
          <path class="connector-bridge connector-signal" d="M 189.82,-69.09 L 210.49,-76.61"/>
          <path class="connector-bridge" d="M 223.15,19.52 L 247.06,21.61"/>
          <path class="connector-bridge" d="M -244.23,-43.06 L -269.84,-47.58"/>
        </g>

<script>
(function(){
  'use strict';

  // ── VisibleEyeLife — unchanged in behavior from Prototype 02: motion is
  // only allowed while the tab is visible, the assembly is in view, and the
  // user has not requested reduced motion. Still no autoplay loop — every
  // transition is caused directly by a setVisibleEyeState call. Still
  // exposed on window for introspection.
  var VisibleEyeLife = (function(){
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    var reduced = mq.matches;
    var docVisible = !document.hidden;
    var inView = true;
    var observer = null;
    var root = document.documentElement;

    function applyMotionState(){
      var allow = !reduced && docVisible && inView;
      root.classList.toggle('eye-motion-ok', allow);
    }
    function onVisibilityChange(){ docVisible = !document.hidden; applyMotionState(); }
    function onMqChange(e){ reduced = e.matches; applyMotionState(); }

    document.addEventListener('visibilitychange', onVisibilityChange);
    if(mq.addEventListener) mq.addEventListener('change', onMqChange);
    else if(mq.addListener) mq.addListener(onMqChange);

    function observe(el){
      if(!el || !('IntersectionObserver' in window)) return;
      observer = new IntersectionObserver(function(entries){
        var entry = entries[0];
        inView = !!(entry && entry.isIntersecting);
        applyMotionState();
      }, {threshold:0.01});
      observer.observe(el);
    }
    function destroy(){
      document.removeEventListener('visibilitychange', onVisibilityChange);
      if(mq.removeEventListener) mq.removeEventListener('change', onMqChange);
      else if(mq.removeListener) mq.removeListener(onMqChange);
      if(observer) observer.disconnect();
    }

    applyMotionState();
    return { observe: observe, destroy: destroy, isReduced: function(){ return reduced; } };
  })();
  window.VisibleEyeLife = VisibleEyeLife;

  // ── setVisibleEyeState — identical API and state list to Prototype 01/02,
  // mapped to the same real semantic lifecycle discovered in
  // Problem-v86-DARK-ONLY.html's Home hero. This pass only makes each
  // state's CSS deltas bigger/more spatially meaningful (see the
  // stylesheet); it does not change the state list, the function
  // signature, or the class-swap mechanism.
  var STATES = ['watching','searching','found','solved','embodied','idle'];
  var current = 'watching';

  function setVisibleEyeState(name){
    if(STATES.indexOf(name) === -1) name = 'watching';
    var assembly = document.getElementById('eyeAssembly');
    if(!assembly) return current;
    for(var i=0;i<STATES.length;i++) assembly.classList.remove('state-'+STATES[i]);
    assembly.classList.add('state-'+name);
    current = name;
    var readout = document.getElementById('eyeDebugReadout');
    if(readout) readout.textContent = name;
    var buttons = document.querySelectorAll('#eyeDebugPanel button[data-state]');
    for(var b=0;b<buttons.length;b++){
      buttons[b].classList.toggle('is-active', buttons[b].getAttribute('data-state')===name);
    }
    return name;
  }
  window.setVisibleEyeState = setVisibleEyeState;
  window.getVisibleEyeState = function(){ return current; };

  document.addEventListener('DOMContentLoaded', function(){
    VisibleEyeLife.observe(document.getElementById('eyeAssembly'));
    setVisibleEyeState('watching');

    // Debug controls: only when the URL explicitly requests them.
    // Normal view and screenshots never contain this panel.
    var params = new URLSearchParams(window.location.search);
    if(params.get('debug') === '1'){
      var panel = document.createElement('div');
      panel.id = 'eyeDebugPanel';
      var h = document.createElement('h4');
      h.textContent = 'Visible Eye — debug';
      panel.appendChild(h);
      STATES.forEach(function(s){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('data-state', s);
        btn.textContent = s;
        btn.addEventListener('click', function(){ setVisibleEyeState(s); });
        panel.appendChild(btn);
      });
      var readout = document.createElement('div');
      readout.className = 'eye-debug-readout';
      readout.id = 'eyeDebugReadout';
      readout.textContent = current;
      panel.appendChild(readout);
      var rmNote = document.createElement('div');
      rmNote.className = 'eye-debug-readout';
      rmNote.textContent = 'reduced-motion: ' + (VisibleEyeLife.isReduced() ? 'on' : 'off');
      panel.appendChild(rmNote);
      document.body.appendChild(panel);
      setVisibleEyeState('watching');
    }
  });
})();
</script>
