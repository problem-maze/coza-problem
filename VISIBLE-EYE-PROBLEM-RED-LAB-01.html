  /* ══════════════════════════════════════════════════════════════
     ISOLATED RED-IDENTITY TEST — PROBLEM RED LAB 01.
     Geometry is FROZEN, copied verbatim from
     VISIBLE-EYE-ARCHITECTURE-REFINE-01.html. Identical across all
     three specimens: same paths, same order, same widths, same
     alpha hierarchy, same role mapping. The ONLY variable across
     R1 / R2 / R3 is --red-base.

     ENVIRONMENT (fixed, identical in all three):
     · Main lunar canvas #FAFBFD, pure surface #FFFFFF — genuinely
       white/lunar, never tinted warm.
     · Structural authority: outer lid + pupil are graphite #24272E,
       never red.

     RED HIERARCHY (identical formula in all three, only the base
     hue changes):
     · 100% base red  — the two innermost rings, the two emphasized
       edges, and the six accent ticks at the two earned intersection
       points. This is the only place the red appears at full
       strength, so it reads as concentrated identity, not an
       overall red interface.
     · 72% red / 28% lunar white — the three outer-mid rings + the
       macro bracket. Supporting presence, one clear step down.
     · 45% red / 55% lunar white — the outermost ring only.
     · 22% red / 78% lunar white — the three witness lines. A faint
       red trace, barely above the white field, present only because
       it still belongs to the red family.
     · #DDE1E7 (soft neutral, not red at all) — the five cross-ties.
       These are the most numerous, least meaningful marks in the
       piece, so they recede completely into neutral gray rather
       than diluting the red family further.

     Derived via CSS color-mix(in srgb, ...) from a single
     --red-base custom property per specimen — the three panels
     share one stylesheet and one geometry block; nothing is
     hand-tuned per specimen beyond that one hex value.

     No gradient, glow, bloom, shadow, glass, material, animation,
     or new geometry. Flat color only.
     ══════════════════════════════════════════════════════════════ */
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    background:#FAFBFD; color:#24272E;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 24px;
  }
  .row{ display:flex; gap:20px; width:1400px; max-width:100%; }
  .specimen{ flex:1; }
  .panel{
    background:#FFFFFF; border:1px solid #DDE1E7; border-radius:16px; padding:18px 14px;
  }
  .panel svg{ display:block; width:100%; height:auto; }
  .cap{ text-align:center; font-size:13px; font-weight:600; margin-top:12px; letter-spacing:0.01em; }
  .cap .hex{ font-weight:400; opacity:0.55; font-variant-numeric:tabular-nums; margin-left:4px; }

  svg {
    --lunar: #FAFBFD;
    --red-100: var(--red-base);
    --red-72: color-mix(in srgb, var(--red-base) 72%, var(--lunar) 28%);
    --red-45: color-mix(in srgb, var(--red-base) 45%, var(--lunar) 55%);
    --red-22: color-mix(in srgb, var(--red-base) 22%, var(--lunar) 78%);
  }
  .spec-r1 svg{ --red-base:#B75C58; }
  .spec-r2 svg{ --red-base:#C76862; }
  .spec-r3 svg{ --red-base:#A94F50; }

  .role-ink{ stroke:#24272E; stroke-opacity:1; }
  .role-pupil{ fill:#24272E; }
  .role-primary{ stroke:var(--red-100); stroke-opacity:1; }
  .role-secondary{ stroke:var(--red-72); stroke-opacity:0.9; }
  .role-outer{ stroke:var(--red-45); stroke-opacity:0.85; }
  .role-witness{ stroke:var(--red-22); stroke-opacity:0.6; }
  .role-tie{ stroke:#DDE1E7; stroke-opacity:0.55; }
  .role-accent{ stroke:var(--red-100); stroke-opacity:1; }
</style>
