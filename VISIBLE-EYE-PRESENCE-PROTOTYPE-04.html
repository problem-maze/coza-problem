<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visible Eye — Presence Prototype 04</title>
<style>
  /* ══════════════════════════════════════════════════════════════
     ISOLATED INTEGRATED PROTOTYPE 04 — fourth pass, same locked lid/
     pupil/lunar-white shell and same overall complexity level as
     Prototype 03. Four targeted fixes, not a rebuild:

     1) CORE — replaced the four-arc-plus-four-bridge assembly with
        ONE continuous organic "chamber wall": a single partial
        boundary whose radius follows a wobble function (a dominant-
        side tightening plus a small irregular harmonic, not a
        perfect ellipse), open across one real gap on the quiet side.
        A fainter echo pass gives it wall thickness. A strut spans
        the two lips of the opening, in gentle tension. A few ticks
        are attached directly to wall vertices. This reads as one
        object, not assembled parts.
     2) RED — is now a literal recolored segment of that same wall
        curve (computed with the identical wobble formula, just a
        different angular window), plus one small tick that touches
        it. Nowhere else. It is glued to the wall's own shape, not a
        separate ring drawn near it.
     3) WHOLE-EYE CHARACTER — the two dominant mid-field boundaries
        now share the core's wobble-wall language and the same
        CENTER bias, so the nesting reads as one organism at
        increasing scale rather than independently placed rings.
     4) MOTION — the wall, the red segment, and the opening strut all
        interpolate their 'd' geometry across three keyframes on the
        same timing, so red always stays glued to the wall as both
        genuinely reconfigure (not a scale/opacity trick). The pupil
        drifts independently (refocus), and one mid-field boundary
        gets its own small independent 'd' shift (a relationship
        change one layer out).
     ══════════════════════════════════════════════════════════════ */

    background:#FAFBFD; color:#24272E;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 24px;
  }
  .stage{
    width:840px; max-width:100%; background:#FFFFFF;
    border:1px solid #E4E7EC; border-radius:20px; padding:28px 22px;
  }
  .stage svg{ display:block; width:100%; height:auto; }
  svg{
    --lunar:#FAFBFD; --ink:#24272E; --red-base:#B75C58;
    --red-72: color-mix(in srgb, var(--red-base) 72%, var(--lunar) 28%);
  }
  .eye-lid{ fill:none; stroke:var(--ink); stroke-width:2.2; stroke-linecap:round; }
</style>

  <script>
    const cycles = [
      ["midEmphA", 3.5, -0.4], ["midEmphB", 5, -1.2], ["midEmphC", 6.5, -2.5], ["midEmphD", 8, -3.5],
    ];
    cycles.forEach(([id, dur, beginOff]) => {
      const el = document.getElementById(id);
      if (!el) return;
      const base = parseFloat(el.getAttribute('stroke-opacity'));
      const anim = document.createElementNS('http://www.w3.org/2000/svg', 'animate');
      anim.setAttribute('attributeName', 'stroke-opacity');
      const lo = Math.max(0.07, base*0.5).toFixed(3);
      const hi = Math.min(0.9, base*1.45).toFixed(3);
      anim.setAttribute('values', `${base};${hi};${lo};${base}`);
      anim.setAttribute('keyTimes', '0;0.35;0.7;1');
      anim.setAttribute('dur', dur + 's');
      anim.setAttribute('begin', beginOff + 's');
      anim.setAttribute('calcMode', 'spline');
      anim.setAttribute('keySplines', '0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1');
      anim.setAttribute('repeatCount', 'indefinite');
      el.appendChild(anim);
    });
  </script>
